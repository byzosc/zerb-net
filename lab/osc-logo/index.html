<title>zosc signature motion</title>
<!--
================================================================================================
 zosc — signature motion prototype (lab, 2026-10-08). Zero build, one file, no network.
 Not part of the site: nothing in app/ references this page.

 CONCEPT
   zosc = Z + osc(illator). Z is the maker (the lightning Z mark, straight strokes, sharp
   corners: a discharge). osc is an oscillator (a synth's voice, a chip's crystal clock) and
   also the raw material of motion (easing, springs, sines). o, s and c are all curves, so they
   can grow out of one continuous waveform. Memory hook: THE WAVE BECOMES THE WORD.

 CAUSALITY (each step is caused by the one before; timing may move, the chain may not)
   1 Z discharge  The Z is struck in stroke order top bar -> diagonal -> bottom bar. The flash
                  fires when the diagonal lands; the current then runs along the bottom bar
                  and leaves the Z at the tip of that bar (top-right corner of the angled cut).
   2 start-up     That tip is the oscillator's output: a thin orange trace is flung out to the
                  right, carrying ragged high-frequency jitter whose amplitude grows (a crystal
                  at power-on). The beam spot rides the head of the trace.
   3 phase lock   The travel has come to rest on a whole number of cycles, so the start of
                  the band is now a node: the wave is pinned there. Noise dies away and the
                  wave is stretched about that node: the frequency drops and whole cycles
                  slide out of the right end one by one, each one slower than the last, until
                  exactly two periods remain; the amplitude rings once and settles (a spring).
                  The lead from the Z tip calms to a clean curve. Lock = the glow swells once.
                  The two remaining periods sit exactly where o, s and c will stand.
   4 the word     The locked sine is cut into three arcs and each one is laid onto its letter
                  by path interpolation (never an opacity swap), left to right:
                    o  lead + first crest; both ends swing down round the o's centre and snap
                       the ring shut at the bottom (polar interpolation about the centre).
                    s  the next full period (trough + crest) stands up: a rigid 90 deg clockwise
                       turn about its centre while the sine reshapes into Montserrat's s.
                    c  the last trough rolls 90 deg clockwise about the bowl's centre and keeps
                       wrapping until it stops as the c (polar, with a small spring overshoot).
                  Each line first takes its letter's path, then gains Montserrat 800's weight.
   5 heartbeat    The oscillator keeps running: every 2.7 s a scope spot lights in the o's
                  counter and one ring spreads out from it. Very quiet.

 TIMELINE (ms)                                  what / how
   0-85      Z top bar wiped L->R               SVG mask: thick butt-capped stroke, dashoffset
   85-190    Z diagonal strikes down-left       same, ease-in (accelerates like a strike)
   190       flash (one frame white + bloom)    Z fill #fff for 33 ms, masked blurred copy decays
   190-335   Z bottom bar runs L->R to the tip  same mask; the angled tip is revealed last
   345-820   trace flung out to the band end    polyline y(x,t) every 2 units, head = beam spot
   345-900   jitter; amplitude x0.05 -> x1.15   value noise + 2 sines, reseeded every 30 ms;
                                                the wave travels right and comes to rest at 900
   900-1400  phase lock                         cycles 9 -> 2 (ease-out) about the node at the
                                                band start; noise -> 0 by 1300; amplitude rings
                                                (240 ms period) and settles exactly at 1400
   1420      lock cue                           glow and trace brighten once (gaussian, 60 ms)
   1400-1540 locked sine holds                  static: the clean sine is readable ~300 ms
   1540-1960 o closes                           polar interp. of 161 rungs; ring shut ~1896,
                                                then only the weight settles; exact glyph at end
   1620-2040 s stands up                        rigid turn + interp. in the turning frame,
                                                6 deg spring overshoot
   1700-2120 c rolls and stops                  polar interp. + the same spring
   2550 + 2700k  heartbeat                      dot + ring in the o's counter, 900 ms each
   ?t=<ms> freezes any moment; window.osc.seek(ms) does the same for the recorder.

 TECHNIQUE
   * Everything is a pure function render(t). No GSAP, no flubber, no CDN: seeking is exact
     and the recorder (record.mjs, Chrome DevTools Protocol) gets the same frame every time.
     JS cost is < 0.5 ms per frame in every phase (record.mjs perf).
   * One coordinate system for the whole lockup: Montserrat font units (1000/em), y down,
     baseline 0, the o's origin at x 0. Z mark height = cap height (700), gap Z->o = 70,
     no tracking (Montserrat has no o-s / s-c kerning). Lockup = 55% of the 1600 canvas.
   * Letters: the outlines of o/s/c at wght 800 are baked into the data block below by
     build-glyphs.py (fontTools: instantiate the variable font at 800, flatten, pick 161
     "rungs" per letter = matching points on both sides of the stroke). A wave arc is turned
     into the same kind of ribbon (centre line +- half the trace width), and the page
     interpolates rung by rung: spine in polar coords (o, c) or in a rotating frame (s),
     half-width separately so the line first takes the letter's path and then its weight.
     At the end the ribbon is exactly the glyph outline; it is then swapped for the font's
     own quadratic outline (identical to < 0.05 px, so the swap is invisible).
   * The sine is fitted to the type, not the other way round: wavelength = 2/3 of the
     distance between the o's centre and the c's bowl centre (811.8 units), amplitude = the
     o's centre-line radius (204), axis = the o's centre height. That is why one crest is
     already the top half of the o and the last trough the bottom of the c.
   * The wave's polarity is forced by the s: only a period that dips FIRST, turned 90 deg,
     gives an S (the other polarity gives a mirrored S, and a turn cannot mirror). Hence:
     crest (o), trough + crest (s), trough (c) — and the lead must leave the Z going up.
   * ?v=orange (default) keeps osc in the signal colour; ?v=white keeps each letter orange
     while it moves and cools it to paper as it lands, so the only orange left is the
     heartbeat. ?debug=1 overlays real Montserrat 800 text (outline) on the final letters to
     prove the baked paths match the font (checked: they coincide).
   * prefers-reduced-motion: the final lockup is drawn at once, no heartbeat.

 KNOWN TRADE-OFFS
   * The jitter is per-frame random (deterministic per 30 ms tick). It reads as electrical
     noise; on a slow display it can read as flicker.
   * The s has to shrink while it stands up (a period is 812 units long, the s is ~470 tall).
     That is the one place the "same arc" is visibly rescaled rather than just bent.
   * The lead from the Z tip to the first crest is absorbed into the o (its left leg swings in
     from the Z), so the o is the only letter built from slightly more than one arc.
   * White variant: orange -> paper passes through salmon for ~4 frames per letter.
   * The swap from ribbon to exact glyph and the hide/show of the wave are the only discrete
     switches; both happen where the geometry already coincides.
================================================================================================
-->

  const Z_D = 'M56.39 0.0L56.24 0.15L45.99 0.15L45.84 0.3L43.16 0.45L39.45 1.19L34.7 2.82L29.94 5.35L26.23 8.17L23.48 10.92L20.51 14.78L18.72 17.9L18.42 18.65L18.65 18.87L19.54 18.28L24.74 15.75L26.97 14.86L32.76 13.08L36.92 12.18L40.64 11.74L40.79 11.59L41.83 11.59L41.98 11.44L48.37 11.14L48.22 11.44L44.35 13.82L35.74 19.91L31.28 23.33L27.93 26.23L44.13 26.37L4.9 74.96L0.0 81.2L0.07 81.58L84.18 81.58L100.0 66.2L99.93 65.97L99.78 66.12L98.89 66.12L97.1 66.57L90.42 67.46L90.27 67.61L89.38 67.61L86.55 68.2L38.63 68.13L70.13 29.49L85.74 10.77L86.78 9.29L94.21 0.22L57.13 0.15L56.39 0.0Z';

  // ---------------------------------------------------------------- morph setup

  function renderBeat(t) {

    const ringOp = 0.7 * (1 - ru) * smooth(30, 90, k);
    show('beat', 1);
    for (const id of ['beat-ring', 'beat-glow', 'beat-dot']) { $(id).setAttribute('cx', f1(cx)); $(id).setAttribute('cy', f1(cy)); }
    $('beat-dot').setAttribute('r', f1(13 * dotIn));
    $('beat-dot').setAttribute('opacity', dot.toFixed(3));
    $('beat-glow').setAttribute('r', f1(30 * dotIn));
    $('beat-glow').setAttribute('opacity', (0.9 * dot).toFixed(3));
    $('beat-ring').setAttribute('r', f1(ringR));
    $('beat-ring').setAttribute('opacity', ringOp.toFixed(3));
  }

  function render(t) {
    renderZ(t);
    renderWave(t);
    renderLetters(t);
    renderBeat(t);
  }

  // ---------------------------------------------------------------- playback
  let start = 0, raf = 0, playing = false;
  function loop(now) {
    render(now - start);
    raf = requestAnimationFrame(loop);
  }
  function play() {
    cancelAnimationFrame(raf);
    if (REDUCED) { render(1e6); return; }
    playing = true;
    start = performance.now();
    raf = requestAnimationFrame(loop);
  }
  function seek(t) { cancelAnimationFrame(raf); playing = false; render(t); }
  $('replay').addEventListener('click', play);
  window.osc = { seek, play, render, END, T, layout: { SCALE, X0, Y0, LAM, AMP, XB0, XB1, TIP, GAP, H_Z } };

  if (T_FIXED !== null) seek(T_FIXED);
  else if (CAPTURE) seek(-1);
  else play();
})();
</script>
</body>
</html>
